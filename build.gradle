/**
 * The buildscript {} block is where you configure the repositories and
 * dependencies for Gradle itself--meaning, you should not include dependencies
 * for your modules here. For example, this block includes the Android plugin for
 * Gradle as a dependency because it provides the additional instructions Gradle
 * needs to build Android app modules.
 */


buildscript {

    /**
     * The repositories {} block configures the repositories Gradle uses to
     * search or download the dependencies. Gradle pre-configures support for remote
     * repositories such as JCenter, Maven Central, and Ivy. You can also use local
     * repositories or define your own remote repositories. The code below defines
     * JCenter as the repository Gradle should use to look for its dependencies.
     */

    repositories {
        google()
    }

    /**
     * The dependencies {} block configures the dependencies Gradle needs to use
     * to build your project. The following line adds Android Plugin for Gradle
     * version 2.2.0 as a classpath dependency.
     */

    dependencies {
        classpath 'com.github.triplet.gradle:play-publisher:3.7.0'
        classpath 'com.android.tools.build:gradle:9.4.1'
    }
}

plugins {
    id 'com.gladed.androidgitversion' version '0.4.3'
}

// Drop the "-g<hash>[-<branch>][-dirty]" part of the default format
// ("%tag%%-count%%-commit%%-branch%%-dirty%"), so a normal build's
// versionName reads e.g. "1.17.3-5" (5 commits past tag 1.17.3) instead
// of "1.17.3-5-ge86aba6". Builds with no tag reachable (shallow clone,
// exported source tree without .git) are unaffected by this - the plugin
// still reports its own "unknown"/"untagged_<hash>" name in that case,
// which project/build.gradle replaces with a dev-build marker.
androidGitVersion {
    format = '%tag%%-count%'
}

/**
 * The allprojects {} block is where you configure the repositories and
 * dependencies used by all modules in your project, such as third-party plugins
 * or libraries. Dependencies that are not required by all the modules in the
 * project should be configured in module-level build.gradle files. For new
 * projects, Android Studio configures JCenter as the default repository, but it
 * does not configure any dependencies.
 */

allprojects {
   repositories {
       google()
   }
}
