name: Release (Build on Tag)

on:
  push:
    tags: "*"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      # create/edit the GitHub release and upload the APK to it
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: ndk
      uses: nttld/setup-ndk@v1.0.6
      with: 
        ndk-version: r26b
    - name: set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: OpenSSL keystore
      run: chmod +x gradlew
    - name: Build with Gradle
      run: ./gradlew build
    - name: Test with Gradle
      run: ./gradlew test
    - name: assembleRelease
      run: ./gradlew assembleRelease
    - name: debug
      run: find . -name *.apk
    - name: Sign app APK
      uses: Tlaster/android-sign@v1.2.2
      with:
        releaseDirectory: project/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        output: build/release/signed
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      env:
        BUILD_TOOLS_VERSION: "37.0.0"
    # The signing step appends "-signed" to Gradle's
    # "reversatile-release-<version>-unsigned.apk", which ended up as
    # "...-unsigned-signed.apk" - name it "reversatile-<version>.apk" instead.
    - name: Rename signed APK
      run: |
        for f in build/release/signed/*.apk; do
          name=$(basename "$f")
          name=${name/-release-/-}
          name=${name/-unsigned-signed/}
          [ "$f" = "build/release/signed/$name" ] || mv "$f" "build/release/signed/$name"
        done
        ls -l build/release/signed
    - name: play store
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        packageName: de.earthlingz.oerszebra
        releaseFiles: build/release/signed/*.apk
        track: beta
        inAppUpdatePriority: 2
        userFraction: 0.33
        status: inProgress
        whatsNewDirectory: whatsnew
    # Creates the GitHub release if the tag was pushed without one, or keeps
    # the title and text of a release that was already written by hand -
    # either way the English Play Store release notes are added below the
    # existing text (once, so a re-run doesn't add them twice), and the APK
    # is attached.
    - name: Upload binaries to release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ github.ref_name }}
      run: |
        notes=$(cat whatsnew/whatsnew-en-US)
        if gh release view "$TAG" > /dev/null 2>&1; then
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in
            *"$notes"*) ;;
            "") gh release edit "$TAG" --notes "$notes" ;;
            *) gh release edit "$TAG" --notes "$(printf '%s\n\n%s' "$body" "$notes")" ;;
          esac
        else
          gh release create "$TAG" --title "$TAG" --notes "$notes"
        fi
        gh release upload "$TAG" build/release/signed/*.apk --clobber
