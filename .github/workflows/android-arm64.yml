name: Build and Test (arm64, host JNI)

# Exercises the real droidzebra-jni.c JNI entry points on genuine arm64
# hardware, without an Android emulator at all.
#
# We tried a real arm64-v8a Android emulator first (see git history): it
# never boots on GitHub-hosted runners ("Timeout waiting for emulator to
# boot"), matching a long-open upstream issue - GitHub's hosted runners
# have no /dev/kvm for the Android emulator to use, arm64 host or not.
#
# Instead: project/hostjni/Makefile compiles the same JNI + zebra engine
# sources Android.mk does, but for the host (glibc, system JDK's jni.h)
# instead of the NDK (Bionic) - no Android runtime involved at all. A
# plain JVM unit test (project/src/test/java/.../HostJniSmokeTest.java)
# then loads that .so and drives ZebraEngine's real native methods
# directly. Running that on an actual arm64 GitHub-hosted runner needs no
# virtualization whatsoever - it's just a normal process on its own real
# CPU, so none of the KVM/emulator problems above apply.

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test-host-jni-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential zlib1g-dev

      - name: Build host libdroidzebra.so (arm64)
        run: make -C project/hostjni

      - name: run HostJniSmokeTest
        run: ./gradlew test --tests "com.shurik.droidzebra.HostJniSmokeTest" --info

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-jni-test-report-arm64
          path: project/build/reports/tests/
