name: Build and Test (arm64, experimental)

# Runs a small subset of the androidTest suite against a genuine
# arm64-v8a system image instead of the main workflow's x86 emulator.
# GitHub-hosted runners have no KVM acceleration for a cross-architecture
# (x86 host / arm64 guest) CPU, so this runs unaccelerated (QEMU TCG) -
# slower, but it executes real arm64 machine code end to end through the
# actual droidzebra-jni.c JNI entry points (via ZebraEngine's native
# methods), unlike the main workflow's x86 emulator, which only gets
# ARM correctness via app-level ABI translation. Kept as a separate,
# capped-down job (a handful of WThor games, not the full 200) so an
# unaccelerated run stays bounded; not yet proven to reliably boot on
# GitHub-hosted infra, hence "experimental" and a generous but finite
# timeout.
#
# Lives on this PR (the Zebra engine sync) rather than the Analyze Game
# feature PR, since this is exactly what it's meant to validate: real
# arm64 execution of the just-resynced native engine.

on:
  push:
    branches: [ development ]
  pull_request:
    branches: [ development ]

jobs:
  test-arm64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Enable KVM
        run: |
         echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
         sudo udevadm control --reload-rules
         sudo udevadm trigger --name-match=kvm
      - name: run tests (arm64-v8a, unaccelerated)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: arm64-v8a
          ndk: 26.1.10909125
          script: ./gradlew connectedCheck -Pandroid.testInstrumentationRunnerArguments.class=de.earthlingz.oerszebra.WthorReplayTest#replayGamesFast -Pandroid.testInstrumentationRunnerArguments.wthorGameLimit=5
      - name: Print test results
        if: failure()
        run: find project/build -path '*androidTest-results*' -name '*.xml' -print -exec cat {} \;
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-report-arm64
          path: project/build/reports/androidTests/connected/
