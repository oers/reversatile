apply plugin: 'com.android.application'
apply from: "deploy.gradle"


project.ext.set("archivesBaseName", "reversatile")


android {


    compileSdk 37
    buildToolsVersion '37.0.0'
    useLibrary 'android.test.base'
    useLibrary 'android.test.mock'

    defaultConfig {
        multiDexEnabled false
        versionName androidGitVersion.name() ?: "thor-test"
        versionCode Math.max(1017004, androidGitVersion.code())
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
        minSdkVersion 21
        targetSdkVersion 37
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }

        release {
            signingConfig null
        }

    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'README.txt']
        }
        jniLibs.useLegacyPackaging = false
    }

    ndkVersion "26.1.10909125"

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'

        }
    }

    android.applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "reversatile-${variant.name}-${variant.versionName}${variant.signingReady? "-signed" : "-unsigned"}.apk"
        }
    }
    sourceSets {
        androidTest {
            assets.srcDirs = ['src/androidTest']
        }
    }
    compileOptions {
        targetCompatibility 1.8
        sourceCompatibility 1.8
    }
    testOptions {
        unitTests {
            // android.util.Log (used for diagnostics, not control flow, by
            // ZebraEngine/GameState) throws "not mocked" under AGP's default
            // stub android.jar otherwise - this makes it a harmless no-op
            // instead, same as most plain-JVM Android unit tests need.
            returnDefaultValues = true
        }
    }
    lint {
        disable 'GoogleAppIndexingWarning', 'UnusedAttribute'
    }
    namespace 'de.earthlingz.oerszebra'
    testNamespace 'de.earthlingz.oerszebra.tests'


}

repositories {
    mavenCentral()
    google()
    maven { url "https://jitpack.io" }
}

dependencies {
    api 'com.google.guava:guava:33.3.1-android'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.vectordrawable:vectordrawable-animated:1.2.0'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.github.matomo-org:matomo-sdk-android:4.1.4'
    implementation 'org.apache.commons:commons-lang3:3.17.0'

    implementation 'com.github.Innovattic:range-seek-bar:v1.0.6'
    implementation(platform('org.jetbrains.kotlin:kotlin-bom:2.0.21'))

    // Required -- JUnit 4 framework
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    testImplementation 'junit:junit:4.13.2'
    // On-device, org.json.* is provided by the Android platform; for plain
    // JVM unit tests (no device/emulator) that exercise the real JNI code
    // calling back into org.json (droidzebra-json.c), this standalone
    // implementation takes precedence over AGP's stub android.jar version
    // on the unit test classpath and behaves correctly, not just stubbed.
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    // Optional -- Mockito framework
    testImplementation 'org.mockito:mockito-core:5.14.2'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    // Optional -- Hamcrest library
    androidTestImplementation 'org.hamcrest:hamcrest-library:3.0'
}

// HostJniSmokeTest loads the real droidzebra JNI library via
// ZebraEngine's own static System.loadLibrary("droidzebra") - that
// resolves through java.library.path (set once, at JVM start; a runtime
// System.load() elsewhere in the test wouldn't satisfy it), so point it
// at project/hostjni/Makefile's output. The test itself skips cleanly
// (via Assume) when that .so hasn't been built, so this is a no-op on
// any workflow that doesn't build it first.
tasks.withType(Test).configureEach {
    systemProperty 'java.library.path', "$projectDir/hostjni/build"
}
